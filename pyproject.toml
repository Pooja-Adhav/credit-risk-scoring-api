[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "1.0.0"
description = "Explainable credit default model served as a REST API"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Pooja Adhav" }]
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
train = ["ucimlrepo>=0.0.7", "matplotlib>=3.7", "truststore>=0.9", "xlrd>=2.0", "openpyxl>=3.1"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5", "matplotlib>=3.7", "ucimlrepo>=0.0.7",
       "truststore>=0.9", "xlrd>=2.0", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
