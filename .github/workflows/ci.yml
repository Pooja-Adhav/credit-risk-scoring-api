name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Train a model on synthetic data
        run: |
          pip install -e ".[dev]"
          python -m credit_risk.data --synthetic
          python -m credit_risk.train --no-plots
      - name: Build image
        run: docker build -t credit-risk-api .
      - name: Smoke test the running container
        run: |
          docker run -d -p 8000:8000 --name api credit-risk-api
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/score -H "Content-Type: application/json" \
            -d '{"limit_bal":50000,"education":2,"age":35,"repayment_status":[2,2,0,0,0,0],"bill_amounts":[48000,47000,45000,40000,38000,30000],"payment_amounts":[0,1500,2000,1500,1500,2000]}'
